server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html landing.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "Study Planner is healthy\n";
    }

    location = /nginx_status {
        stub_status;
        access_log off;

        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}
