<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - Login</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen">

    <div class="bg-white w-[380px] p-8 rounded-2xl shadow-xl">

        <!-- Heading -->
        <a href="landing.html" class="block text-3xl font-bold text-center text-blue-600 hover:opacity-90">
            📚 Study Planner
        </a>

        <form class="mt-6" id="loginForm">

            <!-- Email -->
            <label class="block font-semibold text-gray-700 mb-2">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
                required
            >

            <!-- Password -->
            <label class="block font-semibold text-gray-700 mb-2">
                Password
            </label>

            <div class="relative">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >

                <span
                    id="togglePassword"
                    class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-xl select-none"
                >
                    👁️
                </span>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex justify-between items-center mt-5 text-sm">

                <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#" onclick="alert('Password reset link sent to your email.'); return false;" class="text-blue-600 hover:underline">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->
            <button
                type="submit"
                id="loginBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold mt-6 transition duration-300 cursor-pointer"
            >
                Login
            </button>

            <!-- Signup -->
            <p class="text-center text-gray-600 mt-5">
                Don't have an account?
                <a href="signup.html" class="text-blue-600 font-semibold hover:underline">
                    Sign Up
                </a>
            </p>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
