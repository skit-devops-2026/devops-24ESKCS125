services:
  study-planner:
    build:
      context: .
      dockerfile: Dockerfile
    image: study-planner:latest
    container_name: study-planner
    ports:
      - "8080:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: study-planner-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
