services:
  study-planner:
    build:
      context: .
      dockerfile: Dockerfile
    image: study-planner:latest
    container_name: study-planner
    ports:
      - "8080:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: study-planner-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
   
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: study-planner-blackbox
    ports:
      - "9115:9115"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: study-planner-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped