<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - Sign Up</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 flex items-center justify-center min-h-screen">

    <div class="bg-white w-[380px] p-3 rounded-2xl shadow-xl">

        <!-- Heading -->
        <a href="landing.html" class="block text-3xl font-bold text-center text-blue-600 hover:opacity-90">
            📚 Study Planner
        </a>
        <p class="text-center text-gray-500 mt-2">
            Create Your Account
        </p>
        <form class="mt-6" onsubmit="event.preventDefault(); validateForm(); return false;">
            <!-- Full Name -->
            <label class="block font-semibold text-gray-700 mb-2">
                Full Name
            </label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
            >
            <!-- Email -->
            <label class="block font-semibold text-gray-700 mb-2">
                Email
            </label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
            >
            <!-- Password -->
            <label class="block font-semibold text-gray-700 mb-2">
                Password
            </label>
            <div class="relative mb-4">
                <input
                    type="password"
                    id="password"
                    placeholder="Create Password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <span
                    onclick="showPassword()"
                    class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-xl"
                >
                    👁️
                </span>
            </div>
            <!-- Confirm Password -->
            <label class="block font-semibold text-gray-700 mb-2">
                Confirm Password
            </label>
            <div class="relative">
                <input
                    type="password"
                    id="confirm"
                    placeholder="Confirm Password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <span
                    onclick="showConfirmPassword()"
                    class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-xl"
                >
                    👁️
                </span>
            </div>
            <!-- Signup Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold mt-6 transition duration-300"
            >
                Sign Up
            </button>
            <!-- Login Link -->
            <p class="text-center text-gray-600 mt-5">
                Already have an account?
                <a href="login.html" class="text-blue-600 font-semibold hover:underline">
                    Login
                </a>
            </p>
        </form>
    </div>
    <script>
        function showPassword()
        {
            var pass = document.getElementById("password");
            if(pass.type=="password")
            {
                pass.type="text";
            }
            else
            {
                pass.type="password";
            }
        }
        function showConfirmPassword()
        {
            var confirm = document.getElementById("confirm");

            if(confirm.type=="password")
            {
                confirm.type="text";
            }
            else
            {
                confirm.type="password";
            }
        }
        async function validateForm() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirm").value;

            if (!name || !email || !password || !confirm) {
                alert("Please fill all fields.");
                return false;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return false;
            }
            if (password !== confirm) {
                alert("Password does not match.");
                return false;
            }

            const button = document.querySelector('button[type="submit"]');
            const originalText = button.innerText;
            button.disabled = true;
            button.innerText = "Creating account...";

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json().catch(() => null);
                if (response.ok && data && data.user) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    alert("Account created successfully!");
                    window.location.href = "dashboard.html";
                    return false;
                }
            } catch (e) {}

            try {
                let users = JSON.parse(localStorage.getItem('studyUsers') || '[]');
                if (!Array.isArray(users)) users = [];
                const existing = users.find(u => u.email === email);
                if (existing) {
                    alert("An account with this email already exists. Please log in.");
                    window.location.href = "login.html";
                    return false;
                }
                const newUser = { name, email, password };
                users.push(newUser);
                localStorage.setItem('studyUsers', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify({ name, email }));
                alert("Account created successfully!");
                window.location.href = "dashboard.html";
                return false;
            } catch (err) {
                alert("Account created successfully!");
                localStorage.setItem('currentUser', JSON.stringify({ name, email }));
                window.location.href = "dashboard.html";
                return false;
            } finally {
                button.disabled = false;
                button.innerText = originalText;
            }
            return false;
        }
    </script>
</body>
</html>
